# 5D Connect Four: nginx configuration for the site. Include this file from the http {} block
# (for example from /etc/nginx/conf.d/), then set server_name, root and the certificate paths.
# Netlify and Cloudflare Pages read public/_headers and public/_redirects instead; Apache reads
# public/.htaccess. The three carry the same values; _headers says why each one is what it is.
# This file is for a site at the root of its own domain, which is what the README recommends.

# The bundle and the sounds carry a hash of their contents in their names, so they can be kept a
# year; everything else keeps its name from one deploy to the next and is revalidated every load.
map $uri $mdc4_cache_control {
  default            "no-cache";
  ~^/_expo/static/   "public, max-age=31536000, immutable";
  ~^/assets/         "public, max-age=31536000, immutable";
}

server {
  listen 80;
  listen [::]:80;
  server_name example.com;
  return 301 https://$host$request_uri;
}

server {
  # http2 as a parameter of listen, which every nginx reads. The `http2 on;` directive that
  # replaces it appeared in nginx 1.25.1: older ones (Ubuntu 24.04 packages 1.24, Debian 12
  # 1.22) refuse it and `nginx -t` fails, while 1.25.1 and newer read this form and only warn
  # that it is deprecated.
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name example.com;

  # The folder `npm run build:web` writes (dist-web/), copied here. Never a git checkout.
  root /var/www/multidconnect4;
  index index.html;

  ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

  server_tokens off;
  autoindex off;
  charset utf-8;

  # A missing page, and a folder with no index, both answer the site's own not-found page.
  error_page 404 /404.html;
  error_page 403 =404 /404.html;
  location = /404.html { internal; }

  # Never serve a dotfile (.git above all), except /.well-known/.
  location ~ /\.(?!well-known/) { return 404; }
  # The files in the built folder that are not part of the site. These rules are the server's and
  # hold whatever `root` names, so should it ever be a checkout they also refuse README.md and
  # deploy/ (and the rule above, .git/); the rest of a checkout would be served.
  location ~ ^/(_headers|_redirects|metadata\.json|README\.md|deploy/.*)$ { return 404; }
  # nginx's stock mime.types has no entry for .wav; the sound effects are audio/wav.
  location ~ \.wav$ {
    types { audio/wav wav; }
    try_files $uri =404;
  }
  location / {
    try_files $uri $uri/ =404;
  }

  # Set here, in the server block, and in no location: a location with an add_header of its own
  # inherits none of these.
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'sha256-47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU='; img-src 'self'; media-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests; require-trusted-types-for 'script'; trusted-types 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "accelerometer=(), attribution-reporting=(), autoplay=(self), browsing-topics=(), camera=(), clipboard-read=(), clipboard-write=(self), display-capture=(), encrypted-media=(), fullscreen=(), gamepad=(), geolocation=(), gyroscope=(), hid=(), identity-credentials-get=(), idle-detection=(), join-ad-interest-group=(), local-fonts=(), magnetometer=(), microphone=(), midi=(), otp-credentials=(), payment=(), picture-in-picture=(), private-aggregation=(), publickey-credentials-create=(), publickey-credentials-get=(), run-ad-auction=(), screen-wake-lock=(), serial=(), shared-storage=(), shared-storage-select-url=(), storage-access=(), usb=(), window-management=(), xr-spatial-tracking=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Cache-Control $mdc4_cache_control always;
}
